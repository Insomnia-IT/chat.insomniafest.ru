worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream element_web {
        server matrix_element:80;
    }

    upstream synapse {
        server matrix_synapse:8008;
    }

    upstream livekit_http {
        server matrix_livekit:7880;
    }

    upstream livekit_rtc {
        server matrix_livekit:7881;
    }

    # 1) Element Web: chat.insomniafest.ru
    server {
        listen 80;
        server_name chat.insomniafest.ru;

        location / {
            proxy_pass http://element_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Synapse Admin
        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://matrix_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /help {
            alias /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }

    # 2) Synapse API/backend: synapse.insomniafest.ru
    server {
        listen 80;
        server_name synapse.insomniafest.ru;

        location ^~ /_matrix/ {
            proxy_pass http://synapse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            client_max_body_size 50M;
        }

        location ^~ /_synapse/ {
            proxy_pass http://synapse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            client_max_body_size 50M;
        }

        location / {
            return 404;
        }
    }

    # 3) LiveKit: livekit.insomniafest.ru
    server {
        listen 80;
        server_name livekit.insomniafest.ru;

        location /rtc {
            proxy_pass http://livekit_rtc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://livekit_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        location = /sfu/get {
            default_type application/json;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";

            if ($request_method = OPTIONS) {
                return 204;
            }

            return 200 '{
                "url": "wss://livekit.insomniafest.ru",
                "jwt": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2aWRlbyI6eyJyb29tSm9pbiI6dHJ1ZSwicm9vbSI6IiFzS1lsWlBrQWZERGZidlZOdXY6aW5zb21uaWFmZXN0LnJ1In0sImlhdCI6MTc3NDQzNDg1NywiZXhwIjoxNzc0NDM4NDU3LCJpc3MiOiIzMGQxMzgwNmFlNGM2YzM4OGM3ODFmYzlmZjAyNTQ3MmZlZTk1MjI2NjcwNjZlNGI2MGVhNzNjZGEwOWFjZTdlIn0.T8kLWkKR7psGFwo7qJvbHGfYwCCVgJJ-fOR3jqwTLw8"
            }';
        }
    }
}
